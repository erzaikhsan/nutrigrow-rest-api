services:
  - type: web
    name: nutrigrow-api
    runtime: node
    plan: free
    region: singapore
    branch: dev
    buildCommand: yarn install --frozen-lockfile && yarn db:generate && yarn db:deploy && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGINS
        value: ""
      - key: SMTP_FROM_NAME
        value: NutriGrow
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
